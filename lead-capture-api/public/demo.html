<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Website — Lead Capture Widget Test Page</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      background-color: #f8fafc;
      color: #334155;
      margin: 0;
      padding: 40px 20px;
    }
    .page-container {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 600;
      color: #0369a1;
      background: #e0f2fe;
      border-radius: 9999px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 28px;
      color: #0f172a;
      margin-top: 0;
      margin-bottom: 12px;
    }
    p.lead {
      font-size: 16px;
      color: #64748b;
      margin-bottom: 30px;
    }
    .embed-box {
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 24px;
      background: #f1f5f9;
      margin-top: 30px;
    }
    .embed-title {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      margin-bottom: 16px;
    }
    .widget-selector {
      margin-bottom: 20px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .widget-input {
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      flex: 1;
      font-size: 14px;
    }
    .btn-reload {
      padding: 8px 16px;
      background: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="page-container">
    <span class="badge">Customer Test Page</span>
    <h1>Acme Growth SaaS</h1>
    <p class="lead">
      This page simulates a website embedding our lead-capture widget via a single <code>&lt;script&gt;</code> tag.
    </p>

    <div class="widget-selector">
      <label for="customWidgetId"><strong>Widget ID:</strong></label>
      <input type="text" id="customWidgetId" class="widget-input" placeholder="Paste Widget UUID here..." />
      <button class="btn-reload" onclick="reloadWidget()">Load Widget</button>
    </div>

    <div class="embed-box">
      <div class="embed-title">Embedded Widget Mount Point:</div>
      <div id="lead-capture-widget"></div>
    </div>
  </div>

  <script>
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    const defaultApiUrl = window.location.origin;
    const initialId = getQueryParam("id") || "00000000-0000-0000-0000-000000000001";
    document.getElementById("customWidgetId").value = initialId;

    function loadScript(widgetId) {
      const oldScript = document.getElementById("lc-script-tag");
      if (oldScript) oldScript.remove();
      window.__LeadCaptureWidgetInitialized = false;

      const script = document.createElement("script");
      script.id = "lc-script-tag";
      script.src = defaultApiUrl + "/widget.v1.js?id=" + encodeURIComponent(widgetId);
      script.setAttribute("data-widget-id", widgetId);
      script.setAttribute("data-api-url", defaultApiUrl);
      document.body.appendChild(script);
    }

    function reloadWidget() {
      const val = document.getElementById("customWidgetId").value.trim();
      if (val) {
        loadScript(val);
      }
    }

    loadScript(initialId);
  </script>

</body>
</html>
